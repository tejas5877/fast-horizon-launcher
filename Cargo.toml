[package]
name = "fast-horizon-launcher"
version = "1.0.0"
edition = "2021"
authors = ["AN0N"]
description = "A fast, offline-first Rust launcher for Horizon Minecraft with automatic FastClient, TLauncher, and JDK auto-detection."
license = "MIT"
readme = "README.md"
repository = "https://github.com/AN0N/fast-horizon-launcher"
keywords = ["minecraft", "horizon", "rust", "launcher", "fastclient"]
categories = ["games", "command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
